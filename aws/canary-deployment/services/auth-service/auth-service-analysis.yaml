apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: auth-service-success-rate
  namespace: app
spec:
  args:
    - name: service-name
  
  metrics:
    # HTTP 성공률 체크 (강화된 버전)
    - name: success-rate
      interval: 30s
      count: 5
      successCondition: result[0] >= 0.90  # 90% 이상 성공률
      failureCondition: result[0] < 0.85   # 85% 미만시 즉시 실패
      failureLimit: 2  # 2번 실패시 롤백
      provider:
        job:
          spec:
            backoffLimit: 0
            template:
              spec:
                containers:
                  - name: curl
                    image: curlimages/curl:7.85.0
                    command: ["/bin/sh", "-c"]
                    args:
                      - |
                        set -e
                        echo "Testing Auth Service: {{args.service-name}}"
                        echo "Timestamp: $(date)"
                        
                        # 더 정교한 헬스체크
                        success=0
                        total=20  # 테스트 횟수 증가
                        
                        # 연속 실패 카운트
                        consecutive_failures=0
                        max_consecutive_failures=3
                        
                        for i in $(seq 1 $total); do
                          echo "Test $i/$total"
                          
                          # HTTP 응답 코드와 응답 시간 측정
                          response=$(curl -s -w "%{http_code}:%{time_total}" -m 5 http://{{args.service-name}}.app.svc.cluster.local:80/actuator/health 2>/dev/null || echo "000:0")
                          http_code=$(echo $response | cut -d: -f1)
                          response_time=$(echo $response | cut -d: -f2)
                          
                          if [ "$http_code" = "200" ]; then
                            success=$((success + 1))
                            consecutive_failures=0
                            echo "  ✓ Success (${response_time}s)"
                          else
                            consecutive_failures=$((consecutive_failures + 1))
                            echo "  ✗ Failed (HTTP: $http_code)"
                            
                            # 연속 실패 체크 (즉시 롤백 조건)
                            if [ $consecutive_failures -ge $max_consecutive_failures ]; then
                              echo "  ❌ CRITICAL: $consecutive_failures consecutive failures detected!"
                              echo "  🔄 Triggering immediate rollback..."
                              break
                            fi
                          fi
                          
                          sleep 1
                        done
                        
                        success_rate=$(awk "BEGIN {printf \"%.2f\", $success / $total}")
                        echo ""
                        echo "=== Auth Service Analysis Results ==="
                        echo "Success rate: $success_rate ($success/$total)"
                        echo "Consecutive failures: $consecutive_failures"
                        echo "Rollback threshold: < 0.90"
                        echo "Critical threshold: >= 3 consecutive failures"
                        
                        # 롤백 조건 체크
                        if [ $consecutive_failures -ge $max_consecutive_failures ]; then
                          echo "❌ ROLLBACK TRIGGERED: Critical failure threshold exceeded"
                          echo "0.00"  # 강제 실패값
                        else
                          echo $success_rate
                        fi
                restartPolicy: Never

    # 추가 메트릭: 응답 시간 체크
    - name: response-time
      interval: 45s
      count: 3
      successCondition: result[0] < 2.0  # 2초 미만
      failureCondition: result[0] > 5.0  # 5초 초과시 실패
      failureLimit: 1
      provider:
        job:
          spec:
            backoffLimit: 0
            template:
              spec:
                containers:
                  - name: curl
                    image: curlimages/curl:7.85.0
                    command: ["/bin/sh", "-c"]
                    args:
                      - |
                        set -e
                        echo "Response Time Test for: {{args.service-name}}"
                        
                        total_time=0
                        count=5
                        
                        for i in $(seq 1 $count); do
                          response_time=$(curl -s -w "%{time_total}" -o /dev/null -m 10 http://{{args.service-name}}.app.svc.cluster.local:80/actuator/health 2>/dev/null || echo "10.0")
                          echo "Test $i: ${response_time}s"
                          total_time=$(awk "BEGIN {print $total_time + $response_time}")
                        done
                        
                        avg_time=$(awk "BEGIN {printf \"%.2f\", $total_time / $count}")
                        echo "Average response time: ${avg_time}s"
                        
                        if [ $(awk "BEGIN {print ($avg_time > 5.0)}") -eq 1 ]; then
                          echo "❌ PERFORMANCE ISSUE: Response time too high"
                        fi
                        
                        echo $avg_time
                restartPolicy: Never

    # 에러율 모니터링
    - name: error-rate
      interval: 60s
      count: 3
      successCondition: result[0] < 0.05  # 5% 미만 에러율
      failureCondition: result[0] > 0.15  # 15% 초과시 실패
      failureLimit: 1
      provider:
        job:
          spec:
            backoffLimit: 0
            template:
              spec:
                containers:
                  - name: curl
                    image: curlimages/curl:7.85.0
                    command: ["/bin/sh", "-c"]
                    args:
                      - |
                        set -e
                        echo "Error Rate Test for: {{args.service-name}}"
                        
                        errors=0
                        total=30
                        
                        for i in $(seq 1 $total); do
                          http_code=$(curl -s -o /dev/null -w "%{http_code}" -m 3 http://{{args.service-name}}.app.svc.cluster.local:80/actuator/health 2>/dev/null || echo "000")
                          
                          if [ "$http_code" != "200" ]; then
                            errors=$((errors + 1))
                          fi
                          
                          # 짧은 간격으로 테스트
                          sleep 0.5
                        done
                        
                        error_rate=$(awk "BEGIN {printf \"%.4f\", $errors / $total}")
                        echo "Error rate: $error_rate ($errors/$total errors)"
                        
                        if [ $(awk "BEGIN {print ($error_rate > 0.15)}") -eq 1 ]; then
                          echo "❌ HIGH ERROR RATE: Triggering rollback"
                        fi
                        
                        echo $error_rate
                restartPolicy: Never