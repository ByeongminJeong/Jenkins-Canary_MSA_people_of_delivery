apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: module-common-rollout
  namespace: app
  labels:
    app: module-common
spec:
  replicas: 1

  # 카나리 배포 전략 (기업 표준 비율 - 공통 모듈)
  strategy:
    canary:
      steps:
      - setWeight: 10        # 1단계: 10% 트래픽 (초기 검증)
      - pause: {duration: 60s}  # 1분 대기

      - analysis:            # 2단계: 자동 분석
          templates:
          - templateName: module-common-success-rate
          args:
          - name: service-name
            value: module-common

      - setWeight: 25        # 3단계: 25% 트래픽 (기능 검증)
      - pause: {duration: 90s}  # 1.5분 대기

      - setWeight: 50        # 4단계: 50% 트래픽 (성능 검증)
      - pause: {duration: 120s}  # 2분 대기

      - analysis:            # 5단계: 재분석
          templates:
          - templateName: module-common-success-rate
          args:
          - name: service-name
            value: module-common

      - setWeight: 100       # 6단계: 100% 트래픽 (완전 전환)

      # 서비스 설정
      canaryService: module-common-canary
      stableService: module-common-stable

      # 트래픽 라우팅 (ALB Weighted Target Groups 자동 처리)
      # ALB Ingress Controller가 stable/canary 서비스를 자동으로 감지하여 트래픽 분할

  # 롤백 시점 설정
  revisionHistoryLimit: 5

  # 파드 템플릿
  selector:
    matchLabels:
      app: module-common

  template:
    metadata:
      labels:
        app: module-common
        version: "v1.0.0"
#      annotations:
#        prometheus.io/scrape: "true"
#        prometheus.io/port: "8011"
#        prometheus.io/path: "/actuator/prometheus"
    spec:
      # Node Selector & Tolerations
      nodeSelector:
        eks.amazonaws.com/nodegroup: app-ng   # app-ng 노드 그룹에만 배포
      tolerations:
        - key: "app"                          # app=true taint 허용
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"

      containers:
      - name: module-common
        image: ${ECR_REGISTRY}/${ECR_PREFIX}/module-common:${IMAGE_TAG}
        ports:
        - containerPort: 8011
          name: http

        # 환경변수 설정 - Jenkins 파이프라인과 일치하도록 수정
        env:
        # Spring 프로파일 설정
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        # 데이터베이스 설정
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            configMapKeyRef:
              name: module-common-config
              key: db-url
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            configMapKeyRef:
              name: module-common-config
              key: db-username
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: module-common-secrets
              key: db-password

        # 서비스 포트 설정
        - name: SERVER_PORT
          valueFrom:
            configMapKeyRef:
              name: module-common-config
              key: service-port

        # 리소스 제한 (Spring Boot에 적합하게 증가)
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "500m"

        # 헬스체크
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8011
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8011
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

        # 시작 프로브 (Spring Boot 시작 시간 고려하여 연장)
        startupProbe:
          httpGet:
            path: /actuator/health
            port: 8011
          initialDelaySeconds: 60  # 1분으로 연장
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 20     # 최대 5분 대기 (15초 * 20회)
