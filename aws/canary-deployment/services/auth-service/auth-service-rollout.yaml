apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: auth-service-rollout
  namespace: app
  labels:
    app: auth
    service: auth-service
spec:
  replicas: 1

  # 카나리 배포 전략 개선 - main, dev, canary 브랜치별 최적화
  strategy:
    canary:
      # 브랜치별 단계 조정
      steps:
      - setWeight: 10        # 1단계: 10% (빠른 초기 검증)
      - pause: {duration: 30s}

      - analysis:            # 2단계: 초기 분석
          templates:
          - templateName: auth-service-success-rate
          args:
          - name: service-name
            value: auth-service
      
      - setWeight: 25        # 3단계: 25% (중간 검증)
      - pause: {duration: 60s}

      - analysis:            # 4단계: ��간 분석
          templates:
          - templateName: auth-service-success-rate
          args:
          - name: service-name
            value: auth-service
      
      - setWeight: 50        # 5단계: 50% (충분한 검증)
      - pause: {duration: 120s}

      - analysis:            # 6단계: 최종 분석
          templates:
          - templateName: auth-service-success-rate
          args:
          - name: service-name
            value: auth-service
      
      - setWeight: 100       # 7단계: 100% (완전 전환)

      # 서비스 설정 - 명확한 라벨링
      canaryService: auth-service-canary
      stableService: auth-service-stable
      
      # 카나리/스테이블 라벨 자동 관리
      canaryMetadata:
        labels:
          version: canary
      stableMetadata:
        labels:
          version: stable
      
      # 자동 롤백 설정 개선
      analysis:
        templates:
        - templateName: auth-service-success-rate
        args:
        - name: service-name
          value: auth-service

      # 트래픽 관리 - ALB/Ingress와 연동
      trafficRouting:
        # ALB Ingress를 통한 가중치 기반 라우팅
        alb:
          ingress: app-ingress
          servicePort: 80

  # 롤백 설정
  revisionHistoryLimit: 10

  # 선택자
  selector:
    matchLabels:
      app: auth
      service: auth-service

  template:
    metadata:
      labels:
        app: auth
        service: auth-service
        version: "${IMAGE_TAG}"  # Jenkins에서 동적 치환
    spec:
      # 배포 최적화
      nodeSelector:
        eks.amazonaws.com/nodegroup: app-ng
      tolerations:
        - key: "app"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      
      # 안전한 배포를 위한 설정
      terminationGracePeriodSeconds: 30

      containers:
      - name: auth-service
        image: ${ECR_REGISTRY}/${ECR_PREFIX}/auth-service:${IMAGE_TAG}
        ports:
        - containerPort: 8015
          name: http
          protocol: TCP

        # 환경변수 - 브랜치별 설정 지원
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "production"  # 기본값, ConfigMap으로 오버라이드 가능
        - name: DEPLOYMENT_STRATEGY
          value: "${DEPLOYMENT_STRATEGY}"
        - name: IMAGE_TAG
          value: "${IMAGE_TAG}"

        # 데이터베이스 설정 (Jenkins 환경변수에서 직접 주입)
        - name: SPRING_DATASOURCE_URL
          value: "${DB_URL}"
        - name: SPRING_DATASOURCE_USERNAME
          value: "${DB_USERNAME}"
        - name: SPRING_DATASOURCE_PASSWORD
          value: "${DB_PASSWORD}"

        # JWT 설정
        - name: JWT_SECRET
          value: "${JWT_SECRET}"
        - name: JWT_REFRESH_SECRET
          value: "${JWT_REFRESH_SECRET}"
        - name: JWT_EXPIRATION
          value: "3600000"

        # Redis 설정
        - name: SPRING_REDIS_HOST
          value: "${REDIS_HOST}"
        - name: SPRING_REDIS_PORT
          value: "${REDIS_PORT}"

        # 이메일 설정
        - name: SPRING_MAIL_USERNAME
          value: "${MAIL_USERNAME}"
        - name: SPRING_MAIL_PASSWORD
          value: "${MAIL_PASSWORD}"

        # Google OAuth 설정
        - name: GOOGLE_CLIENT_ID
          value: "${GOOGLE_CLIENT_ID}"
        - name: GOOGLE_CLIENT_SECRET_ID
          value: "${GOOGLE_CLIENT_SECRET_ID}"

        # Auth Service 특화 설정
        - name: AUTH_SERVICE_PASSPORT_SECRET
          value: "${AUTH_SERVICE_PASSPORT_SECRET}"

        # 서비스 발견
        - name: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
          value: "http://discovery-service:8761/eureka"

        # 헬스체크 개선
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8015
          initialDelaySeconds: 90
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8015
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1

        # 스타트업 프로브 추가 (Spring Boot 느린 시작 대응)
        startupProbe:
          httpGet:
            path: /actuator/health
            port: 8015
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30  # 최대 5분 대기

        # 리소스 관리
        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"

        # 보안 설정
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true

        # 임시 디렉토리 마운트
        volumeMounts:
        - name: tmp-volume
          mountPath: /tmp
        - name: logs-volume
          mountPath: /app/logs

      # 볼륨 설정
      volumes:
      - name: tmp-volume
        emptyDir: {}
      - name: logs-volume
        emptyDir: {}

      # 파드 보안 정책
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsUser: 1000
