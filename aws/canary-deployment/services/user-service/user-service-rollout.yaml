apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: user-service-rollout
  namespace: app
  labels:
    app: user
    service: user-service
spec:
  replicas: 1

  strategy:
    canary:
      steps:
        - setWeight: 10
        - pause: {duration: 30s}
        - analysis:
            templates:
              - templateName: user-service-success-rate
            args:
              - name: service-name
                value: user-service-canary
        - setWeight: 25
        - pause: {duration: 60s}
        - analysis:
            templates:
              - templateName: user-service-success-rate
            args:
              - name: service-name
                value: user-service-canary
        - setWeight: 50
        - pause: {duration: 120s}
        - analysis:
            templates:
              - templateName: user-service-success-rate
            args:
              - name: service-name
                value: user-service-canary
        - setWeight: 100

      canaryService: user-service-canary
      stableService: user-service-stable

      trafficRouting:
        alb:
          ingress: app-ingress
          servicePort: 80

      # ✨ 추가: 롤백 설정
      abortScaleDownDelaySeconds: 30
      scaleDownDelaySeconds: 30

  revisionHistoryLimit: 10

  selector:
    matchLabels:
      app: user
      service: user-service

  template:
    metadata:
      labels:
        app: user
        service: user-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8014"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      nodeSelector:
        eks.amazonaws.com/nodegroup: app-ng
        workload: app
      tolerations:
        - key: "app"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      containers:
        - name: user-container
          image: ${ECR_REGISTRY}/${ECR_PREFIX}/user-service:${IMAGE_TAG}
          ports:
            - containerPort: 8014
              name: http
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: SPRING_PROFILES_ACTIVE
            # 🔥 기존 환경변수로 통일 (Application 설정과 일치)
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: SPRING_DATASOURCE_URL
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: SPRING_DATASOURCE_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: SPRING_DATASOURCE_PASSWORD
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: REDIS_PORT
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_REFRESH_SECRET
            - name: PASSPORT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: PASSPORT_SECRET
            - name: MAIL_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: SPRING_MAIL_USERNAME
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: SPRING_MAIL_PASSWORD
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET_ID
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: GOOGLE_CLIENT_SECRET_ID
            - name: DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DOMAIN
            # 🔥 Kafka 설정 - 기존 환경변수 사용 (Application과 일치)
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            # ✨ Kafka Consumer 설정 - 기존 환경변수로 매핑
            - name: SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET
            - name: SPRING_KAFKA_CONSUMER_ENABLE_AUTO_COMMIT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: SPRING_KAFKA_CONSUMER_ENABLE_AUTO_COMMIT
            # ✨ 로깅 레벨 설정
            - name: LOGGING_LEVEL_KAFKA
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: LOGGING_LEVEL_KAFKA
            - name: LOGGING_LEVEL_NETWORKLIENT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: LOGGING_LEVEL_NETWORKLIENT
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8014
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8014
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"