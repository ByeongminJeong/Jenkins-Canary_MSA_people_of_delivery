apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: auth-service-rollout
  namespace: app
  labels:
    app: auth
    service: auth-service
spec:
  replicas: 1

  strategy:
    canary:
      # 더 세밀한 카나리 배포 단계
      steps:
      - setWeight: 5   # 1단계: 5% 트래픽
      - pause: {duration: 60s}
      - analysis:
          templates:
          - templateName: auth-service-success-rate
          args:
          - name: service-name
            value: auth-service-canary
      - setWeight: 10  # 2단계: 10% 트래픽
      - pause: {duration: 90s}
      - analysis:
          templates:
          - templateName: auth-service-success-rate
          args:
          - name: service-name
            value: auth-service-canary
      - setWeight: 25  # 3단계: 25% 트래픽
      - pause: {duration: 120s}
      - analysis:
          templates:
          - templateName: auth-service-success-rate
          args:
          - name: service-name
            value: auth-service-canary
      - setWeight: 50  # 4단계: 50% 트래픽
      - pause: {duration: 180s}
      - analysis:
          templates:
          - templateName: auth-service-success-rate
          args:
          - name: service-name
            value: auth-service-canary
      - setWeight: 75  # 5단계: 75% 트래픽
      - pause: {duration: 120s}
      - analysis:
          templates:
          - templateName: auth-service-success-rate
          args:
          - name: service-name
            value: auth-service-canary
      - setWeight: 100 # 6단계: 100% 트래픽 (완전 전환)

      # ALB 트래픽 라우팅 설정
      canaryService: auth-service-canary
      stableService: auth-service-stable

      trafficRouting:
        alb:
          ingress: app-ingress
          servicePort: 80

      # 롤백 설정 (지원되는 필드만 사용)
      abortScaleDownDelaySeconds: 30
      scaleDownDelaySeconds: 30

  revisionHistoryLimit: 10

  selector:
    matchLabels:
      app: auth
      service: auth-service

  template:
    metadata:
      labels:
        app: auth
        service: auth-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8015"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      nodeSelector:
        eks.amazonaws.com/nodegroup: app-ng
        workload: app
      tolerations:
        - key: "app"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      containers:
        - name: auth-container
          image: ${ECR_REGISTRY}/${ECR_PREFIX}/auth-service:${IMAGE_TAG}
          ports:
            - containerPort: 8015
              name: http
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: SPRING_PROFILES_ACTIVE
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: SPRING_DATASOURCE_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: SPRING_DATASOURCE_PASSWORD
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: REDIS_PORT
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_REFRESH_SECRET
            - name: PASSPORT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: PASSPORT_SECRET
            - name: SPRING_MAIL_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: SPRING_MAIL_USERNAME
            - name: SPRING_MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: SPRING_MAIL_PASSWORD
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET_ID
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: GOOGLE_CLIENT_SECRET_ID
            - name: DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DOMAIN
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: KAFKA_BOOTSTRAP_SERVERS
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8015
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8015
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
