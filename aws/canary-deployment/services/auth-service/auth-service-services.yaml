---
# 안정 버전용 서비스
apiVersion: v1
kind: Service
metadata:
  name: auth-service-stable
  namespace: app
  labels:
    app: auth
    version: stable  # 이 라벨이 중요!
spec:
  selector:
    app: auth
    service: auth-service
    version: stable
  ports:
  - name: http
    port: 80
    targetPort: 8015
  type: ClusterIP

---
# 카나리 버전용 서비스
apiVersion: v1
kind: Service
metadata:
  name: auth-service-canary
  namespace: app
  labels:
    app: auth
    version: canary  # 이 라벨이 중요!
spec:
  selector:
    app: auth
    service: auth-service
    version: canary
  ports:
  - name: http
    port: 80
    targetPort: 8015
  type: ClusterIP

---
# 메인 서비스
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: app
  labels:
    app: auth
    version: stable  # 이 라벨이 중요!
spec:
  selector:
    app: auth
    service: auth-service
    version: stable
  ports:
  - name: http
    port: 80
    targetPort: 8015
  type: ClusterIP