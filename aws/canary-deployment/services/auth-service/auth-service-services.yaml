---
# 안정 버전용 서비스
apiVersion: v1
kind: Service
metadata:
  name: auth-service-stable
  namespace: app
  labels:
    app: auth
spec:
  selector:
    app: auth
    service: auth-service
    version: stable  # 이게 중요!
  ports:
  - name: http
    port: 80
    targetPort: 8015
  type: ClusterIP

---
# 카나리 버전용 서비스  
apiVersion: v1
kind: Service
metadata:
  name: auth-service-canary
  namespace: app
  labels:
    app: auth
spec:
  selector:
    app: auth
    service: auth-service
    version: canary  # 이게 중요!
  ports:
  - name: http
    port: 80
    targetPort: 8015
  type: ClusterIP

---
# 메인 서비스 (기본적으로 stable 연결)
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: app
  labels:
    app: auth
spec:
  selector:
    app: auth
    service: auth-service
    version: stable  # stable만 연결
  ports:
  - name: http
    port: 80
    targetPort: 8015
  type: ClusterIP