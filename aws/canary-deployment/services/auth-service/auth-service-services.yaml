---
# 안정 버전용 서비스
apiVersion: v1
kind: Service
metadata:
  name: auth-service-stable
  namespace: app
  labels:
    app: auth
spec:
  selector:
    app: auth
    service: auth-service
    version: stable
  ports:
  - name: http
    port: 80
    targetPort: 8015  # 정확한 포트!
  type: ClusterIP

---
# 카나리 버전용 서비스
apiVersion: v1
kind: Service
metadata:
  name: auth-service-canary
  namespace: app
  labels:
    app: auth
spec:
  selector:
    app: auth
    service: auth-service
    version: stable
  ports:
  - name: http
    port: 80
    targetPort: 8015  # 정확한 포트!
  type: ClusterIP

---
# 메인 서비스 (클러스터 내부)
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: app
  labels:
    app: auth
spec:
  selector:
    app: auth
    service: auth-service
    version: stable
  ports:
  - name: http
    port: 80
    targetPort: 8015  # 정확한 포트!
  type: ClusterIP
