server:
  port: 8011

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always     # 상세 정보 표시
  health:
    db:
      enabled: false           # DB 체크 비활성화
    redis:
      enabled: false


spring:
  application:
    name: module-common

  jpa:
    hibernate.ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true


  spring:
    batch:
      job:
        enabled: false


  datasource:
    url: ${DB_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  cloud:
    config:
      enabled: false

  config:
    activate:
      on-profile: production

  kafka:
    admin:
      auto-create: true
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    properties:
      security.protocol: PLAINTEXT
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      batch-size: 16384
      buffer-memory: 33554432
      properties:
        linger.ms: 10
    consumer:
      group-id: module-common-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

# 앱 전용(토픽 이름) — 기존 키 유지
kafka:
  topics:
    orderEvents: order.events.v1
    orderCommands: order.commands.v1
    inventoryEvents: inventory.events.v1
    inventoryCommands: inventory.commands.v1
    paymentEvents: payment.events.v1
    paymentCommands: payment.commands.v1

    orderEventsDLQ: order.events.dlq.v1
    orderCommandsDLQ: order.commands.dlq.v1
    inventoryEventsDLQ: inventory.events.dlq.v1
    inventoryCommandsDLQ: inventory.commands.dlq.v1
    paymentEventsDLQ: payment.events.dlq.v1
    paymentCommandsDLQ: payment.commands.dlq.v1