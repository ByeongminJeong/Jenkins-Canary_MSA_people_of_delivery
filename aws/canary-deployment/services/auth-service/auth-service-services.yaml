---
# 안정 버전용 서비스
apiVersion: v1
kind: Service
metadata:
  name: auth-service-stable
  namespace: app
  labels:
    app: auth
    version: stable  # Argo Rollouts 검증용
spec:
  selector:
    app: auth
    service: auth-service
    # version 제거! (Rollout selector와 일치)
  ports:
  - name: http
    port: 80
    targetPort: 8015
  type: ClusterIP

---
# 카나리 버전용 서비스
apiVersion: v1
kind: Service
metadata:
  name: auth-service-canary
  namespace: app
  labels:
    app: auth
    version: canary  # Argo Rollouts 검증용
spec:
  selector:
    app: auth
    service: auth-service
    # version 제거! (Rollout selector와 일치)
  ports:
  - name: http
    port: 80
    targetPort: 8015
  type: ClusterIP

---
# 메인 서비스
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: app
  labels:
    app: auth
    version: stable  # Argo Rollouts 검증용
spec:
  selector:
    app: auth
    service: auth-service
    # version 제거! (Rollout selector와 일치)
  ports:
  - name: http
    port: 80
    targetPort: 8015
  type: ClusterIP