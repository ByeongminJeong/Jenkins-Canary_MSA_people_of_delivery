server:
  port: 8014
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true          # 🔥 중요! readiness/liveness 엔드포인트 활성화
      show-details: always
    prometheus:
      enabled: true
  health:
    readinessstate:
      enabled: true            # readiness state 활성화
    livenessstate:
      enabled: true            # liveness state 활성화
    db:
      enabled: false           # DB 체크 비활성화
    redis:
      enabled: false

logging:
  level:
    com.example.cloudfour.modulecommon.util.PassportUtil: DEBUG
    org.springframework.cloud.gateway: WARN
    reactor.netty: WARN
    root: WARN

spring:
  application:
    name: user-service

  jpa:
    hibernate.ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

  datasource:
    url: ${DB_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 4
      minimum-idle: 2
      idle-timeout: 300000        # 5m
      max-lifetime: 1500000       # 25m
      keepalive-time: 1200000     # 20m
      connection-timeout: 30000
      validation-timeout: 3000
      auto-commit: false

  cloud:
    config:
      enabled: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    auth-code-expiration-millis: 1800000

  springdoc:
    api-docs:
      version: openapi_3_1
      enabled: true
    enable-spring-security: true
    default-consumes-media-type: application/json
    default-produces-media-type: application/json

passport:
  secret-key: ${PASSPORT_SECRET}