apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: auth-service-rollout
  namespace: app
  labels:
    app: auth
    service: auth-service
spec:
  replicas: 1

  strategy:
    canary:
      # 더 세밀한 카나리 배포 단계
      steps:
        - setWeight: 5   # 1단계: 5% 트래픽
        - pause: {duration: 60s}
        - analysis:
            templates:
              - templateName: auth-service-success-rate
            args:
              - name: service-name
                value: auth-service-canary
        - setWeight: 10  # 2단계: 10% 트래픽
        - pause: {duration: 90s}
        - analysis:
            templates:
              - templateName: auth-service-success-rate
            args:
              - name: service-name
                value: auth-service-canary
        - setWeight: 25  # 3단계: 25% 트래픽
        - pause: {duration: 120s}
        - analysis:
            templates:
              - templateName: auth-service-success-rate
            args:
              - name: service-name
                value: auth-service-canary
        - setWeight: 50  # 4단계: 50% 트래픽
        - pause: {duration: 180s}
        - analysis:
            templates:
              - templateName: auth-service-success-rate
            args:
              - name: service-name
                value: auth-service-canary
        - setWeight: 75  # 5단계: 75% 트래픽
        - pause: {duration: 120s}
        - analysis:
            templates:
              - templateName: auth-service-success-rate
            args:
              - name: service-name
                value: auth-service-canary
        - setWeight: 100 # 6단계: 100% 트래픽 (완전 전환)

      # ALB 트래픽 라우팅 설정
      canaryService: auth-service-canary
      stableService: auth-service-stable

      trafficRouting:
        alb:
          ingress: app-ingress
          servicePort: 80

      # 롤백 설정 (지원되는 필드만 사용)
      abortScaleDownDelaySeconds: 30
      scaleDownDelaySeconds: 30

  revisionHistoryLimit: 10

  selector:
    matchLabels:
      app: auth
      service: auth-service

  template:
    metadata:
      labels:
        app: auth
        service: auth-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8015"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      nodeSelector:
        eks.amazonaws.com/nodegroup: app-ng
        workload: app
      tolerations:
        - key: "app"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      containers:
        - name: auth-container
          image: ${ECR_REGISTRY}/${ECR_PREFIX}/auth-service:${IMAGE_TAG}
          ports:
            - containerPort: 8015
              name: http
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: SPRING_PROFILES_ACTIVE
            # 🔥 기존 환경변수로 통일 (Application 설정과 일치)
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: SPRING_DATASOURCE_URL
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: SPRING_DATASOURCE_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: SPRING_DATASOURCE_PASSWORD
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: REDIS_PORT
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_REFRESH_SECRET
            - name: PASSPORT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: PASSPORT_SECRET
            - name: MAIL_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: SPRING_MAIL_USERNAME
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: SPRING_MAIL_PASSWORD
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET_ID
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: GOOGLE_CLIENT_SECRET_ID
            - name: DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DOMAIN
            # 🔥 Kafka 설정 - 기존 환경변수 사용 (Application과 일치)
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            # ✨ Kafka Consumer 설정 - 기존 환경변수로 매핑
            - name: SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET
            - name: SPRING_KAFKA_CONSUMER_ENABLE_AUTO_COMMIT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: SPRING_KAFKA_CONSUMER_ENABLE_AUTO_COMMIT
            # ✨ 로깅 레벨 설정
            - name: LOGGING_LEVEL_KAFKA
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: LOGGING_LEVEL_KAFKA
            - name: LOGGING_LEVEL_NETWORKLIENT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: LOGGING_LEVEL_NETWORKLIENT
            # ✨ DLQ Consumer Group 설정 (각 서비스별 고유 ID)
            - name: DLQ_CONSUMER_GROUP_AUTH
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DLQ_CONSUMER_GROUP_AUTH
            - name: DLQ_CONSUMER_GROUP_USER
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DLQ_CONSUMER_GROUP_USER
            - name: DLQ_CONSUMER_GROUP_ORDER
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DLQ_CONSUMER_GROUP_ORDER
            - name: DLQ_CONSUMER_GROUP_PAYMENT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DLQ_CONSUMER_GROUP_PAYMENT
            - name: DLQ_CONSUMER_GROUP_INVENTORY
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DLQ_CONSUMER_GROUP_INVENTORY
            - name: DLQ_CONSUMER_GROUP_RESERVATION
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DLQ_CONSUMER_GROUP_RESERVATION
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8015
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8015
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"