apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: auth-service-rollout
  namespace: app
  labels:
    app: auth
    service: auth-service
spec:
  replicas: 1

  strategy:
    canary:
      # 더 세밀한 카나리 배포 단계
      steps:
      - setWeight: 5   # 1단계: 5% 트래픽
      - pause: {duration: 60s}
      - analysis:
          templates:
          - templateName: auth-service-success-rate
          args:
          - name: service-name
            value: auth-service-canary
      - setWeight: 10  # 2단계: 10% 트래픽
      - pause: {duration: 90s}
      - analysis:
          templates:
          - templateName: auth-service-success-rate
          args:
          - name: service-name
            value: auth-service-canary
      - setWeight: 25  # 3단계: 25% 트래픽
      - pause: {duration: 120s}
      - analysis:
          templates:
          - templateName: auth-service-success-rate
          args:
          - name: service-name
            value: auth-service-canary
      - setWeight: 50  # 4단계: 50% 트래픽
      - pause: {duration: 180s}
      - analysis:
          templates:
          - templateName: auth-service-success-rate
          args:
          - name: service-name
            value: auth-service-canary
      - setWeight: 75  # 5단계: 75% 트래픽
      - pause: {duration: 120s}
      - analysis:
          templates:
          - templateName: auth-service-success-rate
          args:
          - name: service-name
            value: auth-service-canary
      - setWeight: 100 # 6단계: 100% 트래픽 (완전 전환)

      # ALB 트래픽 라우팅 설정
      canaryService: auth-service-canary
      stableService: auth-service-stable

      trafficRouting:
        alb:
          ingress: app-ingress
          servicePort: 80
          # ALB 가중치 라우팅 설정
          rootService: auth-service-stable
          # 트래픽 분배 모니터링을 위한 추가 설정

      # 롤백 설정 강화
      abortScaleDownDelaySeconds: 30
      scaleDownDelaySeconds: 30
      progressDeadlineSeconds: 600

      # Analysis 실패시 자동 롤백
      analysis:
        templates:
        - templateName: auth-service-success-rate
        args:
        - name: service-name
          value: auth-service
        # 분석 실패시 즉시 롤백
        successfulRunHistoryLimit: 5
        unsuccessfulRunHistoryLimit: 5

  revisionHistoryLimit: 10

  selector:
    matchLabels:
      app: auth
      service: auth-service  # eks-app deployment와 일치하도록 복원

  template:
    metadata:
      labels:
        app: auth
        service: auth-service  # eks-app deployment와 일치하도록 복원
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8015"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      nodeSelector:
        eks.amazonaws.com/nodegroup: app-ng
      tolerations:
        - key: "app"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"

      terminationGracePeriodSeconds: 30

      containers:
        - name: auth-service
          image: ${ECR_REGISTRY}/${ECR_PREFIX}/auth-service:${IMAGE_TAG}
          ports:
            - containerPort: 8015  # Pod 포트는 8015 유지
              name: http
              protocol: TCP

          # ConfigMap과 Secret에서 환경변수 로드
          envFrom:
            - configMapRef:
                name: app-config
                optional: true
            - secretRef:
                name: app-secrets
                optional: true

          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: SERVER_PORT
              value: "8015"
            - name: MANAGEMENT_SERVER_PORT
              value: "8015"

          # 헬스체크 설정
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8015
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 20
            timeoutSeconds: 5

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8015
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 3

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8015
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5

          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false

          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
            - name: logs-volume
              mountPath: /app/logs

      volumes:
        - name: tmp-volume
          emptyDir: {}
        - name: logs-volume
          emptyDir: {}