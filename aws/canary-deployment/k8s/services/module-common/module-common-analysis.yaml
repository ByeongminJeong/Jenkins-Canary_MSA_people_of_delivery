apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: module-common-success-rate
  namespace: app
spec:
  args:
  - name: service-name
    value: module-common
  - name: service-namespace
    value: app
  - name: service-port
    value: "8011"
  metrics:
  - name: success-rate
    successCondition: result[0] >= 0.95
    provider:
      prometheus:
        address: http://prometheus:9090
        query: |
          sum(rate(http_requests_total{service="{{args.service-name}}",namespace="{{args.service-namespace}}",status=~"2.."}[5m])) /
          sum(rate(http_requests_total{service="{{args.service-name}}",namespace="{{args.service-namespace}}"}[5m]))
  - name: error-rate
    successCondition: result[0] <= 0.05
    provider:
      prometheus:
        address: http://prometheus:9090
        query: |
          sum(rate(http_requests_total{service="{{args.service-name}}",namespace="{{args.service-namespace}}",status=~"5.."}[5m])) /
          sum(rate(http_requests_total{service="{{args.service-name}}",namespace="{{args.service-namespace}}"}[5m]))
  - name: response-time
    successCondition: result[0] <= 0.5
    provider:
      prometheus:
        address: http://prometheus:9090
        query: |
          histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{service="{{args.service-name}}",namespace="{{args.service-namespace}}"}[5m])) by (le))
  - name: health-check
    successCondition: result[0] >= 1
    provider:
      prometheus:
        address: http://prometheus:9090
        query: |
          up{job="{{args.service-name}}",namespace="{{args.service-namespace}}"}
  - name: module-common-specific-test
    successCondition: result[0] >= 0.95
    provider:
      prometheus:
        address: http://prometheus:9090
        query: |
          sum(rate(http_requests_total{service="{{args.service-name}}",namespace="{{args.service-namespace}}",endpoint="/actuator/health",status=~"2.."}[5m])) /
          sum(rate(http_requests_total{service="{{args.service-name}}",namespace="{{args.service-namespace}}",endpoint="/actuator/health"}[5m]))
