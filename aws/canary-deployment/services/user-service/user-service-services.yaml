---
# 안정 버전용 서비스
apiVersion: v1
kind: Service
metadata:
  name: user-service-stable
  namespace: app
  labels:
    app: user
spec:
  selector:
    app: user
    service: user-service
    version: stable
  ports:
  - name: http
    port: 80
    targetPort: 8014  # 정확한 포트!
  type: ClusterIP

---
# 카나리 버전용 서비스
apiVersion: v1
