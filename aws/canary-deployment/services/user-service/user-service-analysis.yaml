apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: user-service-success-rate
  namespace: app
spec:
  args:
    - name: service-name
  
  metrics:
    # HTTP 성공률 체크
    - name: success-rate
      interval: 30s
      count: 3
      successCondition: result[0] >= 0.90
      failureLimit: 1
      provider:
        job:
          spec:
            backoffLimit: 0
            template:
              spec:
                containers:
                  - name: curl
                    image: curlimages/curl:7.85.0
                    command: ["/bin/sh", "-c"]
                    args:
                      - |
                        set -e
                        echo "Testing User Service: {{args.service-name}}"
                        
                        success=0
                        total=10
                        
                        SERVICE_URL="http://{{args.service-name}}.app.svc.cluster.local:8014"
                        echo "Testing service at: $SERVICE_URL"
                        
                        for i in $(seq 1 $total); do
                          echo "Test $i/$total"
                          if curl -s -f -m 10 --connect-timeout 5 "$SERVICE_URL/actuator/health" > /dev/null 2>&1; then
                            success=$((success + 1))
                            echo "  ✓ Success"
                          else
                            echo "  ✗ Failed"
                          fi
                          sleep 2
                        done
                        
                        success_rate=$(awk "BEGIN {printf \"%.2f\", $success / $total}")
                        echo "User Service Success rate: $success_rate ($success/$total)"
                        echo $success_rate
                restartPolicy: Never

    # API 검증 테스트
    - name: api-validation
      interval: 45s
      count: 2
      successCondition: result[0] >= 0.80
      failureLimit: 1
      provider:
        job:
          spec:
            backoffLimit: 0
            template:
              spec:
                containers:
                  - name: curl
                    image: curlimages/curl:7.85.0
                    command: ["/bin/sh", "-c"]
                    args:
                      - |
                        echo "API Validation for User Service: {{args.service-name}}"
                        
                        success=0
                        total=5
                        
                        BASE_URL="http://{{args.service-name}}.app.svc.cluster.local:8014"
                        echo "Testing API at: $BASE_URL"
                        
                        for i in $(seq 1 $total); do
                          echo "API Test $i/$total"
                        
                          health_ok=false
                          info_ok=false
                        
                          if curl -s -f -m 10 "$BASE_URL/actuator/health" | grep -q '"status":"UP"'; then
                            health_ok=true
                            echo "  ✓ Health endpoint OK"
                          else
                            echo "  ✗ Health endpoint failed"
                          fi
                        
                          if curl -s -f -m 10 "$BASE_URL/actuator/info" > /dev/null 2>&1; then
                            info_ok=true
                            echo "  ✓ Info endpoint OK"
                          else
                            echo "  ✗ Info endpoint failed"
                          fi
                        
                          # User Service 특화 테스트
                          if curl -s -f -m 10 "$BASE_URL/actuator/metrics" > /dev/null 2>&1; then
                            echo "  ✓ Metrics endpoint OK"
                          else
                            echo "  ✗ Metrics endpoint failed"
                          fi
                        
                          if [ "$health_ok" = true ] && [ "$info_ok" = true ]; then
                            success=$((success + 1))
                            echo "  ✓ Core endpoints validated"
                          else
                            echo "  ✗ Core endpoints validation failed"
                          fi
                        
                          sleep 3
                        done
                        
                        api_rate=$(awk "BEGIN {printf \"%.2f\", $success / $total}")
                        echo "User API validation rate: $api_rate ($success/$total)"
                        echo $api_rate
                restartPolicy: Never

    # 응답 시간 테스트
    - name: response-time
      interval: 60s
      count: 2
      successCondition: result[0] <= 2.0
      failureLimit: 1
      provider:
        job:
          spec:
            backoffLimit: 0
            template:
              spec:
                containers:
                  - name: curl
                    image: curlimages/curl:7.85.0
                    command: ["/bin/sh", "-c"]
                    args:
                      - |
                        echo "Response Time Test for User Service"
                        
                        SERVICE_URL="http://{{args.service-name}}.app.svc.cluster.local:8014/actuator/health"
                        total_time=0
                        count=5
                        
                        for i in $(seq 1 $count); do
                          echo "Response time test $i/$count"
                        
                          response_time=$(curl -o /dev/null -s -w "%{time_total}" -m 10 "$SERVICE_URL" 2>/dev/null || echo "999")
                        
                          if [ "$response_time" != "999" ]; then
                            echo "  Response time: ${response_time}s"
                            total_time=$(awk "BEGIN {print $total_time + $response_time}")
                          else
                            echo "  Request failed"
                            total_time=$(awk "BEGIN {print $total_time + 10}")
                          fi
                        
                          sleep 2
                        done
                        
                        avg_time=$(awk "BEGIN {printf \"%.2f\", $total_time / $count}")
                        echo "Average response time: ${avg_time}s"
                        echo $avg_time
                restartPolicy: Never