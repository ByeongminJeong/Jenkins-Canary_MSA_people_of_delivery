apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: user-service-rollout
  namespace: app
  labels:
    app: user
    service: user-service
spec:
  replicas: 3

  strategy:
    canary:
      steps:
      - setWeight: 10
      - pause: {duration: 30s}
      - analysis:
          templates:
          - templateName: user-service-success-rate
          args:
          - name: service-name
            value: user-service
      - setWeight: 25
      - pause: {duration: 60s}
      - analysis:
          templates:
          - templateName: user-service-success-rate
          args:
          - name: service-name
            value: user-service
      - setWeight: 50
      - pause: {duration: 120s}
      - analysis:
          templates:
          - templateName: user-service-success-rate
          args:
          - name: service-name
            value: user-service
      - setWeight: 100

      canaryService: user-service-canary
      stableService: user-service-stable
      
      # 자동 라벨 관리
      canaryMetadata:
        labels:
          version: canary
      stableMetadata:
        labels:
          version: stable
      
      trafficRouting:
        alb:
          ingress: app-ingress
          servicePort: 80

  revisionHistoryLimit: 10

  selector:
    matchLabels:
      app: user
      service: user-service

  template:
    metadata:
      labels:
        app: user
        service: user-service
        # version 제거 - Argo Rollouts가 자동 관리
    spec:
      nodeSelector:
        eks.amazonaws.com/nodegroup: app-ng
      tolerations:
        - key: "app"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      
      terminationGracePeriodSeconds: 30

      containers:
      - name: user-service
        image: ${ECR_REGISTRY}/${ECR_PREFIX}/user-service:${IMAGE_TAG}
        ports:
        - containerPort: 8014
          name: http
          protocol: TCP

        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "production"
        - name: DEPLOYMENT_STRATEGY
          value: "${DEPLOYMENT_STRATEGY}"
        # IMAGE_TAG 환경변수 제거 (불필요)

        # 나머지 환경변수들은 그대로...
        - name: SPRING_DATASOURCE_URL
          value: "${DB_URL}"
        - name: SPRING_DATASOURCE_USERNAME
          value: "${DB_USERNAME}"
        - name: SPRING_DATASOURCE_PASSWORD
          value: "${DB_PASSWORD}"
        - name: JWT_SECRET
          value: "${JWT_SECRET}"
        - name: JWT_REFRESH_SECRET
          value: "${JWT_REFRESH_SECRET}"
        - name: SPRING_REDIS_HOST
          value: "${REDIS_HOST}"
        - name: SPRING_REDIS_PORT
          value: "${REDIS_PORT}"
        - name: SPRING_MAIL_USERNAME
          value: "${MAIL_USERNAME}"
        - name: SPRING_MAIL_PASSWORD
          value: "${MAIL_PASSWORD}"
        - name: GOOGLE_CLIENT_ID
          value: "${GOOGLE_CLIENT_ID}"
        - name: GOOGLE_CLIENT_SECRET_ID
          value: "${GOOGLE_CLIENT_SECRET_ID}"
        - name: USER_SERVICE_PASSPORT_SECRET
          value: "${USER_SERVICE_PASSPORT_SECRET}"
        - name: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
          value: "http://discovery-service:8761/eureka"

        # 헬스체크와 리소스는 그대로 완벽함
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8014
          initialDelaySeconds: 90
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8014
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        startupProbe:
          httpGet:
            path: /actuator/health
            port: 8014
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30

        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"

        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true

        volumeMounts:
        - name: tmp-volume
          mountPath: /tmp
        - name: logs-volume
          mountPath: /app/logs

      volumes:
      - name: tmp-volume
        emptyDir: {}
      - name: logs-volume
        emptyDir: {}

      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsUser: 1000