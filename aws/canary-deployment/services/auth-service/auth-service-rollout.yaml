apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: auth-service-rollout
  namespace: app
  labels:
    app: auth
    service: auth-service
spec:
  replicas: 1

  strategy:
    canary:
      steps:
      - setWeight: 10
      - pause: {duration: 30s}
      - analysis:
          templates:
          - templateName: auth-service-success-rate
          args:
          - name: service-name
            value: auth-service
      - setWeight: 25
      - pause: {duration: 60s}
      - analysis:
          templates:
          - templateName: auth-service-success-rate
          args:
          - name: service-name
            value: auth-service
      - setWeight: 50
      - pause: {duration: 120s}
      - analysis:
          templates:
          - templateName: auth-service-success-rate
          args:
          - name: service-name
            value: auth-service
      - setWeight: 100

      canaryService: auth-service-canary
      stableService: auth-service-stable
      
      trafficRouting:
        alb:
          ingress: app-ingress
          servicePort: 80

  revisionHistoryLimit: 10

  selector:
    matchLabels:
      app: auth
      service: auth-service

  template:
    metadata:
      labels:
        app: auth
        service: auth-service
    spec:
      nodeSelector:
        eks.amazonaws.com/nodegroup: app-ng
      tolerations:
        - key: "app"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      
      terminationGracePeriodSeconds: 30

      containers:
      - name: auth-service
        image: ${ECR_REGISTRY}/${ECR_PREFIX}/auth-service:${IMAGE_TAG}
        ports:
        - containerPort: 8015
          name: http
          protocol: TCP

        # ConfigMap과 Secret에서 환경변수 로드
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secrets

        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"

        # 헬스체크 (TCP로 변경하여 안정성 향상)
        startupProbe:
          tcpSocket:
            port: 8015
          initialDelaySeconds: 120
          periodSeconds: 30
          failureThreshold: 20

        readinessProbe:
          tcpSocket:
            port: 8015
          initialDelaySeconds: 150
          periodSeconds: 30
          failureThreshold: 3

        livenessProbe:
          tcpSocket:
            port: 8015
          initialDelaySeconds: 180
          periodSeconds: 60
          failureThreshold: 3

        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"

        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true

        volumeMounts:
        - name: tmp-volume
          mountPath: /tmp
        - name: logs-volume
          mountPath: /app/logs

      volumes:
      - name: tmp-volume
        emptyDir: {}
      - name: logs-volume
        emptyDir: {}

      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsUser: 1000