# Stable Service
apiVersion: v1
kind: Service
metadata:
  name: user-service-stable
  namespace: app
  labels:
    app: user
    service: user-service
    version: stable
spec:
  selector:
    app: user
    service: user-service
  ports:
    - port: 80          # Ingress에서 참조하는 포트
      targetPort: 8014  # 실제 Pod 포트
      protocol: TCP
      name: http
  type: ClusterIP

---
# Canary Service
apiVersion: v1
kind: Service
metadata:
  name: user-service-canary
  namespace: app
  labels:
    app: user
    service: user-service
    version: canary
spec:
  selector:
    app: user
    service: user-service
  ports:
    - port: 80          # Ingress에서 참조하는 포트
      targetPort: 8014  # 실제 Pod 포트
      protocol: TCP
      name: http
  type: ClusterIP

---
# Main Service
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: app
  labels:
    app: user
    service: user-service
spec:
  selector:
    app: user
    service: user-service
  ports:
    - port: 80          # Ingress에서 참조하는 포트
      targetPort: 8014  # 실제 Pod 포트
      protocol: TCP
      name: http
  type: ClusterIP