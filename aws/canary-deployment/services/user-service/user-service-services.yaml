---
# 안정 버전용 서비스
apiVersion: v1
kind: Service
metadata:
  name: user-service-stable
  namespace: app
  labels:
    app: user
    version: stable  # 추가!
spec:
  selector:
    app: user
    service: user-service
    version: stable  # 추가!
  ports:
  - name: http
    port: 80
    targetPort: 8014
  type: ClusterIP

---
# 카나리 버전용 서비스
apiVersion: v1
kind: Service
metadata:
  name: user-service-canary
  namespace: app
  labels:
    app: user
    version: canary  # 추가!
spec:
  selector:
    app: user
    service: user-service
    version: canary  # 추가!
  ports:
  - name: http
    port: 80
    targetPort: 8014
  type: ClusterIP

---
# 메인 서비스
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: app
  labels:
    app: user
    version: stable  # 추가!
spec:
  selector:
    app: user
    service: user-service
    version: stable  # 추가!
  ports:
  - name: http
    port: 80
    targetPort: 8014
  type: ClusterIP